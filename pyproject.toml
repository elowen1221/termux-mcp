[build-system]
requires = ["flit_core>=3.2"]
build-backend = "flit_core.buildapi"

[project]
name = "termux-mcp"
version = "0.10.2"
description = "Termux AI gateway with REST and MCP — let AI agents safely interact with your Android device in real time"
readme = "README.md"
license = {text = "AGPL-3.0"}
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
]
authors = [{name = "Parixit Sutariya"}]
# The official MCP Python SDK requires Python >= 3.10.
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.28,<2",
    "packaging>=23",
    "tomli>=2; python_version<'3.11'",
    "uvicorn>=0.30",
    "websockets>=13,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.8",
]

[project.scripts]
termux-mcp = "termux_mcp.__main__:run"
