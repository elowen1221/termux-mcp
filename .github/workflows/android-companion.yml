name: Android companion

on:
  push:
    branches: [main]
    paths:
      - 'android-companion/**'
      - '.github/workflows/android-companion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # setup-android@v3 currently asks sdkmanager for the removed legacy 'tools' package.
      # GitHub's ubuntu runner already provides ANDROID_HOME + sdkmanager; install only what we need.
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Prepare stable signing key
        env:
          ANDROID_SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
        run: |
          test -n "$ANDROID_SIGNING_KEYSTORE_B64"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/walnut-signing.jks"
          chmod 600 "$RUNNER_TEMP/walnut-signing.jks"
      - name: Build debug APK
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/walnut-signing.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: walnut-android-bridge-debug
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish in-app update assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          VERSION_CODE=$(grep -o 'versionCode = [0-9]*' app/build.gradle.kts | head -1 | awk '{print $3}')
          SHA256=$(sha256sum "$APK" | awk '{print $1}')
          cp "$APK" walnut-android-bridge-latest.apk
          cat > update.json <<EOF
          {"version_code":$VERSION_CODE,"version_name":"$VERSION_NAME","sha256":"$SHA256","apk_url":"https://github.com/${{ github.repository }}/releases/download/android-companion-latest/walnut-android-bridge-latest.apk"}
          EOF
          gh release view android-companion-latest -R "${{ github.repository }}" >/dev/null 2>&1 || gh release create android-companion-latest -R "${{ github.repository }}" --title "Android companion latest" --notes "Rolling stable-signed Android companion build for in-app updates."
          gh release upload android-companion-latest walnut-android-bridge-latest.apk update.json -R "${{ github.repository }}" --clobber
